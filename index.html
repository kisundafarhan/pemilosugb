<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E-Voting OSIS SMAN 2 Tambun Selatan</title>
<meta name="theme-color" content="#0B6FA8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="manifest" id="mf">
<link rel="icon" id="ic">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--p:#0B6FA8;--pd:#08507A;--g:#F5B800;--ok:#1E9B3C;--bad:#D93025;--bg:#EAF4FA;--tx:#12263A;--mu:#5B6F82;--cd:#fff;--bd:#D5E3EE;--r:16px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0A1A28;--tx:#E8F1F8;--mu:#9DB2C4;--cd:#11283C;--bd:#22405A}}
:root[data-theme=dark]{--bg:#0A1A28;--tx:#E8F1F8;--mu:#9DB2C4;--cd:#11283C;--bd:#22405A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding-bottom:46px}
.hd{background:linear-gradient(120deg,var(--pd),var(--p));color:#fff;display:flex;align-items:center;gap:12px;padding:10px 18px}
.hd div{flex:1}.hd b{font-size:17px}.hd small{display:block;opacity:.85}
.lg{width:44px;height:44px;object-fit:contain}.lg.big{width:96px;height:96px;margin:0 auto 8px;display:block}
.wrap{max-width:1100px;margin:0 auto;padding:18px}.c{display:grid;place-items:center;min-height:68vh}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:var(--r);padding:20px;box-shadow:0 4px 16px rgba(8,80,122,.08)}
.card+.card{margin-top:14px}.login{width:min(420px,100%);text-align:center}
label{display:block;text-align:left;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--bd);border-radius:12px;font:inherit;background:var(--cd);color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(11,111,168,.3);border-color:var(--p)}
.b{background:var(--p);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;width:100%;margin-top:14px}
.b:hover{background:var(--pd)}.b:disabled{opacity:.5;cursor:wait}
.b.gh{background:transparent;color:var(--p);border:1.5px solid var(--p)}.hd .b.gh{color:#fff;border-color:#fff}
.b.sm{width:auto;margin:0;padding:6px 12px;font-size:13px}.b.dg{background:var(--bad)}.b.on{background:var(--g);color:#222}
.err{color:var(--bad);min-height:22px;margin-top:8px;font-weight:600}.mu{color:var(--mu)}.s{font-size:13px;margin-top:10px}
.lnk{color:var(--p);cursor:pointer;font-size:13px;display:inline-block;margin-top:12px;text-decoration:underline}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.kc{display:flex;flex-direction:column;text-align:center}.kc+.kc{margin-top:0}
.kc .ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#CFE6F3}
input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--p)}
.pp{margin-top:10px}.pp .ph{aspect-ratio:4/3;object-position:50% 30%}.pn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;font-size:13px;line-height:1.3}.rl{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.no{background:var(--g);color:#222;font-weight:800;border-radius:99px;padding:2px 16px;margin:10px auto 4px;display:inline-block}
.kc p{white-space:pre-line;text-align:left;font-size:13px;color:var(--mu);margin-top:6px}.kc .b{margin-top:auto}.kc>div{flex:1;margin-bottom:12px}
.ck{width:84px;height:84px;border-radius:50%;background:var(--ok);color:#fff;font-size:48px;display:grid;place-items:center;margin:0 auto 12px}
.nv{display:flex;gap:6px;overflow-x:auto;padding:10px 18px;background:var(--cd);border-bottom:1px solid var(--bd)}
.nv a{padding:8px 14px;border-radius:99px;white-space:nowrap;cursor:pointer;font-weight:600}.nv a.on{background:var(--p);color:#fff}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.st .card{margin:0}.st b{font-size:26px;display:block}
.bar{height:14px;background:var(--bd);border-radius:99px;overflow:hidden;margin:4px 0 12px}.bar i{display:block;height:100%;background:var(--p);transition:width .6s}.bar i.w{background:var(--g)}
.tb{width:100%;border-collapse:collapse;font-size:14px}.tb th,.tb td{padding:8px;border-bottom:1px solid var(--bd);text-align:left}.ox{overflow-x:auto}
.bd{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--bd)}.bd.y{background:var(--ok);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row .b{flex:1;min-width:110px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:50;padding:16px}.md{width:min(420px,100%);text-align:center}
#tst{position:fixed;left:50%;bottom:60px;transform:translate(-50%,20px);background:#12263A;color:#fff;padding:10px 18px;border-radius:12px;opacity:0;transition:.3s;z-index:60;pointer-events:none}#tst.on{opacity:1;transform:translate(-50%,0)}
#off{display:none;background:var(--bad);color:#fff;text-align:center;padding:8px;font-weight:700}
#ban{display:none;background:var(--g);color:#222;padding:8px 18px;align-items:center;gap:10px;justify-content:center}
.ft{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;color:var(--mu);background:var(--bg);border-top:1px solid var(--bd)}
.ft a{color:var(--p);cursor:pointer;margin-left:8px;text-decoration:underline}
#pr{display:none}.kt{border:1px dashed #333;padding:10px;text-align:center;color:#000;break-inside:avoid;font-size:12px}
@media print{body.pc #app,body.pc .hd,body.pc .ft,body.pc #tst,body.pc #off,body.pc #ban{display:none!important}body.pc #pr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.nv,.ft,#tst,#ban{display:none!important}}
</style>
</head>

function call(fn, p) {

function parseBook(buf, defKat) {
  defKat = defKat || 'Siswa';
  const wb = XLSX.read(buf, {type:'array'}), out = [], bad = [];
  wb.SheetNames.forEach(sn => {
    const rs = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, raw:true, defval:''});
    let kelas = '', ci = -1, cn = -1, ck = -1, co = -1, cg = -1;
    rs.forEach((r, i) => {
      const a = String(r[0]).trim(), m = a.match(/^KELAS\s+([XVI]+)\s*\.\s*(\d+)/i);
      if (m) { kelas = m[1].toUpperCase() + '.' + m[2]; ci = cn = ck = co = cg = -1; return; }
      const up = r.map(c => String(c).trim().toUpperCase()), h = up.findIndex(v => /^(NIPD|NIP|NIK|NUPTK|ID|NIP\s*\/\s*ID)$/.test(v));
      if (h >= 0) { ci = h; cn = up.findIndex(v => /^NAMA/.test(v)); ck = up.indexOf('KELAS'); co = up.findIndex(v => /^NO\.?$/.test(v)); cg = up.indexOf('KATEGORI'); return; }
      if (ci < 0 || cn < 0) return;
      const raw = r[ci], big = typeof raw === 'number' && Math.abs(raw) > 9e15;
      let n = typeof raw === 'number' ? String(Math.round(raw)) : String(raw).trim().toUpperCase();
      const nm = String(r[cn]).replace(/\s+/g, ' ').trim(), loc = sn + ' baris ' + (i + 1);
      const kt = cg >= 0 && String(r[cg]).trim() ? normKat(r[cg]) : defKat, g = kt === 'Guru/Staff';
      const kls = g ? 'GURU/STAFF' : (ck >= 0 ? String(r[ck]).replace(/\s+/g, ' ').trim().toUpperCase() : kelas);
      if (!n && !nm) return;
      if (!n) { if (!/=|^JUMLAH/i.test(nm)) bad.push([loc, n, nm, 'ID kosong']); return; }
      if (big) { bad.push([loc, n, nm, 'ID berupa angka terlalu panjang; simpan kolom ID sebagai Teks di Excel']); return; }
      if (!(g ? /^[0-9A-Z]{4,20}$/ : /^\d{5,15}$/).test(n)) { bad.push([loc, n, nm, g ? 'NIP/ID tidak valid (4-20 huruf/angka)' : 'NIPD tidak valid']); return; }
      if (!nm) { bad.push([loc, n, nm, 'Nama kosong']); return; }
      if (co >= 0 && String(r[co]).trim() === '') { bad.push([loc, n, nm, 'Tanpa nomor urut (kemungkinan sudah keluar/pindah)']); return; }
      if (!kls) { bad.push([loc, n, nm, 'Kelas kosong']); return; }
      out.push([n, nm, kls, kt, loc]);
    });
  });
  const c = {}; out.forEach(x => c[x[0]] = (c[x[0]] || 0) + 1);
  const ok = out.filter(x => { if (c[x[0]] > 1) { bad.push([x[4], x[0], x[1], 'ID kembar di file (tidak diimport, periksa manual)']); return false; } return true; });
  return {ok, bad};
}

    case 'resetToken': { const v = M.vs.find(x => x.nipd === p.nipd); v.token = mtok(); return ok({token:v.token}); }
    case 'boxInfo': { const c = {}; M.vs.forEach(v => { c[v.kelas] = c[v.kelas] || {k:v.kelas, t:0, s:0, v:0}; c[v.kelas].t++; if (v.status === 'Sudah') { c[v.kelas].s++; c[v.kelas].v++; } });
      const l = Object.values(c).sort((a, b) => ksort(a.k, b.k)); return ok({total:l.reduce((a, x) => a + x.v, 0), tanpa:0, list:l}); }
    case 'resetBox': { let n = 0; M.vs.forEach(v => { if (v.status === 'Sudah' && (p.all || p.kelas.includes(v.kelas))) { v.status = 'Belum'; v.waktu = ''; v.bilik = ''; n++; } }); M.vt.K1 = Math.max(0, M.vt.K1 - n); return ok({votes:n, voters:n}); }
    case 'resetTokens': M.vs.forEach(v => { if (p.nipds.includes(v.nipd)) v.token = mtok(); }); return ok({count:p.nipds.length});
    case 'delVoters': { const b = M.vs.length; M.vs = M.vs.filter(v => !(p.nipds.includes(v.nipd) && v.status !== 'Sudah')); const d = b - M.vs.length; return ok({deleted:d, skipped:p.nipds.length - d}); }
    case 'log': return ok({list:M.lg});
    case 'settings': return ok({kosong:M.ko, dur:M.du});
    case 'saveSettings': M.ko = p.kosong === 'Ya'; M.du = +p.dur || 5; return ok();
    case 'changePass': return p.o === 'edudigital' && String(p.n).length >= 6 ? ok() : {ok:false, msg:'Password lama salah atau password baru kurang dari 6 karakter (Preview: lama = edudigital)'};
  }
  return {ok:false, msg:'Fungsi tidak dikenal'};
}
